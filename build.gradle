// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '7.3.0' apply false // Example version
    id 'com.android.library' version '7.3.0' apply false // Example version
    // Add Kotlin plugin if using Kotlin
    // id 'org.jetbrains.kotlin.android' version '1.7.20' apply false // Example version
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
